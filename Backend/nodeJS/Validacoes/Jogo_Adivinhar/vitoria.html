<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vitória</title>


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;


font-family:"Segoe UI",Arial,sans-serif;


background:

radial-gradient(circle,#064d32,#050505);


color:white;

overflow:hidden;

}



body::before{

content:"";

position:absolute;

width:500px;

height:500px;

background:#00ff88;

filter:blur(140px);

opacity:.25;

animation:brilho 4s infinite alternate;

}



@keyframes brilho{

from{

transform:scale(.8);

}

to{

transform:scale(1.2);

}

}



.container{


position:relative;


width:450px;


padding:50px;


text-align:center;


background:

rgba(255,255,255,.08);


border-radius:30px;


border:2px solid #00ff8870;


backdrop-filter:blur(10px);


box-shadow:

0 0 40px #00ff8855;


animation:entrada 1s;


}



@keyframes entrada{

from{

opacity:0;

transform:scale(.7);

}


to{

opacity:1;

transform:scale(1);

}

}




.icon{

font-size:90px;


animation:pular 1s infinite;

}



@keyframes pular{


50%{

transform:translateY(-20px);

}


}




h1{


font-size:60px;


color:#00ff88;


text-shadow:

0 0 10px #00ff88,

0 0 40px #00ff88;


margin:20px 0;


}




p{

font-size:20px;

color:#ddd;

margin-bottom:30px;

}




a{


display:inline-block;


padding:15px 35px;


border-radius:30px;


background:#00ff88;


color:#001b10;


text-decoration:none;


font-weight:bold;


transition:.3s;


}



a:hover{


transform:scale(1.1);


box-shadow:

0 0 30px #00ff88;


}



</style>


</head>


<body>



<div class="container">


<div class="icon">
🏆
</div>


<h1>Vitória!</h1>


<p>
Parabéns! Você acertou o número sorteado.
<br>
Continue jogando!
</p>


<a href="/">
Jogar novamente
</a>


</div>



</body>

</html>

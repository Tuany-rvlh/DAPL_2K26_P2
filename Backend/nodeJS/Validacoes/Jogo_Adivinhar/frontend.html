<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo de Adivinhação</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #080808, #16213e);
    color: white;
}

.container {
    width: 420px;
    padding: 40px;
    text-align: center;
    background: rgba(255,255,255,0.08);
    border-radius: 25px;
    backdrop-filter: blur(10px);
    border: 1px solid #00ffff55;
    box-shadow: 0 0 30px #00ffff55;
}

h1 {
    color: #00ffff;
    margin-bottom: 20px;
    font-size: 35px;
}

p {
    color: #ddd;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    outline: none;
    text-align: center;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #00ffff;
    color: #111;
    font-weight: bold;
    font-size: 18px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #00ffff;
}

#resultado {
    margin-top: 25px;
    min-height: 30px;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎯 Adivinhe o Número</h1>

<p>
Escolha um número entre <b>1 e 50</b>
</p>

<input type="number" id="numero" min="1" max="50" placeholder="Digite um número">

<button onclick="jogar()">
Tentar
</button>

<div id="resultado"></div>

</div>

<script>

function jogar() {

    const numero = document.getElementById("numero").value;

    fetch(`/guess?numero=${numero}`)
    .then(res => {

        const tipo = res.headers.get("Content-Type");

        return res.text().then(texto => ({
            tipo,
            texto
        }));

    })
    .then(resposta => {

        if(resposta.tipo.includes("text/html")) {

            document.open();
            document.write(resposta.texto);
            document.close();

        } else {

            document.getElementById("resultado").innerHTML = resposta.texto;

        }

    });

}

</script>

</body>

</html>

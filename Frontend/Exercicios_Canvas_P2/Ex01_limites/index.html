<!--
Exercício 1 – Animação de dois quadrados

Desenvolva uma página utilizando a API Canvas do HTML5 para criar uma
animação contendo dois quadrados.

Requisitos:
• O primeiro quadrado deve se movimentar continuamente na horizontal
(esquerda e direita), invertendo automaticamente o sentido ao atingir
as bordas laterais do canvas.

• O segundo quadrado deve se movimentar continuamente na vertical
(cima e baixo), invertendo automaticamente o sentido ao atingir
as bordas superior e inferior do canvas.

• Os dois quadrados devem permanecer sempre visíveis, sem ultrapassar
os limites do canvas, durante toda a execução da animação.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Canvas</title>
    <style type ="text/css">
        canvas{
            border: 1px solid black;
        }
        

        body {
            margin: 0
        }
    </style>
</head>

<body>
    <canvas></canvas>
    <script src="canvas.js"></script>
    
</body>
</html>
